schema_version: 2
profile: taili_amp_blind
task:
  default_id: RobotLab-Isaac-Taili-AMP-Blind-Direct-v0
runtime:
  data_root: /root/gpufree-data
  telemetry_interval: 10
training_recipe:
  id: taili_phased_acceptance_curriculum_v3
  purpose: 'Taili blind locomotion curriculum. The YAML is the single editable strategy contract; runtime config artifacts
    are generated from it. v3 removes the single-command conditioning phases: all four directions plus stand train together
    from step 0 (strategy-book phi-0), quality gates and the budget-controlled penalty ramp are active from step 0, and later
    phases only add mixed commands, terrain/DR, and the speed envelope.

    '
  command_mode: phase_curriculum
  init_phase: 0
  touchdown_impact_only: true
  phases:
    0:
      command_mode: single_axis
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      prob_fwd: 0.3
      prob_back: 0.15
      prob_lat: 0.15
      prob_yaw: 0.4
      fwd_range:
      - 0.3
      - 0.8
      back_range:
      - 0.15
      - 0.5
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.18
      - 0.65
      note: flat, all four directions + stand train from step 0, while phase progress gates use fwd/back/lat only so
        yaw remains trained and measured without blocking terrain forever. Old note below is retained only as history;
        quality (slip/diag/duty/air) from phase 0. YAW BOOTSTRAP 0704 — yaw was the sole phi0 blocker (plateaued 0.50, needs
        0.70) while fwd/back/lat all reached 0.80; yaw is an anti-symmetric, hard-to-explore behavior. Fix is more yaw gradient
        (prob_yaw 0.25 to 0.40). An earlier gentle-turn bootstrap (yaw min ->0.10) BACKFIRED because 0.10 sat at the moving-gate
        threshold 0.1, so gentle yaw commands were mis-classified as standing and got zero tracking_yaw reward, and the velocity
        curriculum shrank yaw commands to that trivial floor so the robot never practiced the real yaw the spec A2 (err below
        0.15 rad per s across the full yaw range) tests. Reverted so yaw floor is raised to 0.30 for meaningful practice,
        and the moving-gate yaw threshold lowered 0.1 to 0.05 to match yaw_cmd_gate.
    1:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      near_zero_prob: 0.08
      near_zero_scale: 0.04
      mixed_axis_prob: 0.45
      x_axis_prob: 0.75
      prob_fwd: 0.50
      prob_back: 0.50
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.6
      lat_range:
      - 0.15
      - 0.55
      yaw_range:
      - 0.2
      - 0.8
      note: mixed vx/vy/wz plus stop exposure on flat; quality bars tighten (walk-down _1 keys).
    2:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.08
      near_zero_prob: 0.08
      near_zero_scale: 0.04
      mixed_axis_prob: 0.60
      x_axis_prob: 0.72
      prob_fwd: 0.55
      prob_back: 0.45
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.8
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.25
      - 1.0
      note: terrain and domain randomization begin here; tracking bars relax on terrain per spec (controlled traversal, not
        flat-band tracking).
    3:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      near_zero_prob: 0.1
      near_zero_scale: 0.04
      mixed_axis_prob: 0.75
      x_axis_prob: 0.7
      prob_fwd: 0.55
      prob_back: 0.45
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.8
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.25
      - 1.0
      note: final command envelope fixed for terrain traversal; terrain is the primary difficulty axis.
model:
  terrain_perceiver:
    history_len: 25
    tick_dim: 54
    z_dim: 32
    dropout: 0.0
  actor:
    input_dim: 85
    hidden:
    - 1024
    - 512
  terrain_perceiver_aux:
    ramp_steps: 30000
    epochs: 2
    batch: 4096
    lr_scale: 0.75
env:
  observation_contract:
    deployable:
      body_dim: 53
      history_len: 25
      tick_dim: 54
      history_flat_dim: 1350
      actor_raw_dim: 1403
    actor_mlp:
      input_dim: 85
      formula: body_dim + terrain_perceiver.z_dim
    training_only:
      privileged_dim: 197
      aux_label_dim: 22
    policy_tensor_dim: 1622
  amp:
    frame_dim: 51
    frames: 2
    tensor_dim: 102
  observation:
    history_len: 25
    tick_dim: 54
    body_dim: 53
    privileged_dim: 197
    aux_label_dim: 22
    amp_frame_dim: 51
    amp_frames: 2
    observation_space: 1622
    amp_observation_space: 51
  control:
    action_scale: 0.35
    action_delay_steps: 1
    episode_length_s: 20.0
    decimation: 4
    dt: 0.005
    contact_force_threshold: 10.0
  gait:
    period: 0.72
    period_min: 0.56
    period_slope: 0.06
    duty: 0.50
  actuator:
    stiffness:
      hip: 349
      thigh: 120
      calf: 240
    damping:
      hip: 8
      thigh: 4
      calf: 3
  scene:
    num_envs: 4096
    env_spacing: 2.5
  commands:
    resample_s_min: 3.0
    resample_s_max: 6.0
    smooth_alpha: 0.93
    transition_enable: true
    transition_cycles: 1.4
    transition_min_s: 0.4
    transition_max_s: 1.2
    transition_fast_s: 0.18
    transition_sign_flip_v: 0.08
    transition_sign_flip_w: 0.1
    transition_low_speed_v: 0.12
    transition_low_speed_w: 0.16
    transition_contact_feet: 3.0
    transition_zero_frac_min: 0.52
    transition_zero_frac_max: 0.76
    transition_stop_zero_frac: 0.86
    fwd_max: 1.0
    back_max: 0.8
    lat_max: 0.5
    yaw_max: 1.0
  curriculum:
    vel_curriculum_enable: false
    vel_cur_up: 0.85
    vel_cur_down: 0.55
    vel_cur_step: 0.0
    vel_terrain_decouple: false
    phase_intervals: 4
    phase_max_steps: 60000
    penalty_ramp_intervals: 16
    penalty_budget_ratio_max: 1.05
    phase_progress_dirs_0:
    - fwd
    - back
    - lat
    phase_progress_dirs_1:
    - fwd
    - back
    - lat
    phase_progress_dirs_2:
    - fwd
    - back
    - lat
    phase_progress_dirs_3:
    - fwd
    - back
    - lat
    phase_gate_prog_0: 0.65
    phase_gate_prog_1: 0.62
    phase_gate_prog_2: 0.62
    phase_gate_prog_3: 0.68
    phase_gate_slip_0: 0.35
    phase_gate_diag_0: 0.45
    phase_gate_duty_0: 0.55
    phase_gate_air_0: 0.0
    phase_gate_slip_1: 0.31
    phase_gate_diag_1: 0.5
    phase_gate_duty_1: 0.58
    phase_gate_air_1: 0.0
    phase_gate_terrain_2: 3.5
    phase_gate_discrete_terrain_2: 1.0
    phase_gate_fall_2: 0.05
    terrain_start_phase: 2
    dr_start_phase: 2
    max_training_phase: 2
    terrain_curriculum_floor_after_peak: 3
    terrain_curriculum_peak_drop: 2
    terrain_curriculum_move_down_patience: 2
    terrain_curriculum_ignore_flat: true
    regress_fall: 0.1
    regress_prog: 0.4
    terrain_gate_slip_high: 0.26
  terrain:
    stairs:
      step_height_range:
      - 0.08
      - 0.38
      proportion: 0.25
    boxes:
      grid_height_range:
      - 0.05
      - 0.3
  domain_randomization:
    enable: true
    start_level: 0
    unlock_terrain: 6.0
    push_interval_s_0: 0.0
    push_vel_0: 0.0
    push_interval_s_1: 30.0
    push_vel_1: 1.0
    mass_range_1:
    - -2.0
    - 4.0
    stiffness_scale_1:
    - 0.9
    - 1.1
    damping_scale_1:
    - 0.85
    - 1.15
    push_interval_s_2: 20.0
    push_vel_2: 1.5
    mass_range_2:
    - -4.0
    - 12.0
    stiffness_scale_2:
    - 0.8
    - 1.2
    damping_scale_2:
    - 0.7
    - 1.3
    push_interval_s_3: 15.0
    push_vel_3: 2.0
    push_ang_scale: 0.8
    mass_range_3:
    - -5.0
    - 20.0
