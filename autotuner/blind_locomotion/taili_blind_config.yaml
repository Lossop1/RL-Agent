skrl:
  seed: 42
  models:
    separate: true
    policy:
      class: TerrainPerceiverPolicy
      clip_actions: false
      clip_log_std: true
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: -1.0
      fixed_log_std: false
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 1024
        - 512
        activations: relu
      output: ONE
    discriminator:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 1024
        - 512
        activations: relu
      output: ONE
  memory:
    class: RandomMemory
    memory_size: -1
  motion_dataset:
    class: RandomMemory
    memory_size: 200000
  reply_buffer:
    class: RandomMemory
    memory_size: 1000000
  agent:
    class: AMP
    rollouts: 32
    learning_epochs: 4
    mini_batches: 16
    discount_factor: 0.99
    lambda: 0.95
    learning_rate: 0.0001
    learning_rate_scheduler: KLAdaptiveLR
    learning_rate_scheduler_kwargs:
      kl_threshold: 0.016
      min_lr: 3.0e-05
    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null
    amp_state_preprocessor: RunningStandardScaler
    amp_state_preprocessor_kwargs: null
    random_timesteps: 0
    learning_starts: 0
    grad_norm_clip: 1.0
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: true
    entropy_loss_scale: 0.02
    value_loss_scale: 2.5
    discriminator_loss_scale: 5.0
    amp_batch_size: 512
    task_reward_weight: 1.0
    style_reward_weight: 2.0
    discriminator_batch_size: 4096
    discriminator_reward_scale: 3.0
    discriminator_logit_regularization_scale: 0.05
    discriminator_gradient_penalty_scale: 5.0
    discriminator_weight_decay_scale: 0.0001
    time_limit_bootstrap: true
    experiment:
      directory: taili_amp_blind
      experiment_name: ''
      write_interval: auto
      checkpoint_interval: 2000
  trainer:
    class: SequentialTrainer
    timesteps: 1500000
    environment_info: log
