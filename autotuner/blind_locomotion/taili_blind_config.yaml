schema_version: 2
profile: taili_amp_blind
task:
  default_id: RobotLab-Isaac-Taili-AMP-Blind-Direct-v0
runtime:
  data_root: /root/gpufree-data
  telemetry_interval: 10
training_recipe:
  id: taili_phased_acceptance_curriculum_v3
  purpose: 'Taili blind locomotion curriculum. The YAML is the single editable strategy contract; runtime config artifacts
    are generated from it. v3 removes the single-command conditioning phases: all four directions plus stand train together
    from step 0 (strategy-book phi-0), quality gates and the budget-controlled penalty ramp are active from step 0, and later
    phases only add mixed commands, terrain/DR, and the speed envelope.

    '
  command_mode: phase_curriculum
  init_phase: 0
  touchdown_impact_only: true
  phases:
    0:
      command_mode: single_axis
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      prob_fwd: 0.3
      prob_back: 0.15
      prob_lat: 0.15
      prob_yaw: 0.4
      fwd_range:
      - 0.3
      - 0.8
      back_range:
      - 0.15
      - 0.5
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.3
      - 0.9
      note: flat, all four directions + stand from step 0 (no single-command phases) so the command channel carries information
        from the first update and no direction hardens into an attractor. Gate is min progress over all four directions +
        quality (slip/diag/duty/air) from phase 0. YAW BOOTSTRAP 0704 — yaw was the sole phi0 blocker (plateaued 0.50, needs
        0.70) while fwd/back/lat all reached 0.80; yaw is an anti-symmetric, hard-to-explore behavior. Fix is more yaw gradient
        (prob_yaw 0.25 to 0.40). An earlier gentle-turn bootstrap (yaw min ->0.10) BACKFIRED because 0.10 sat at the moving-gate
        threshold 0.1, so gentle yaw commands were mis-classified as standing and got zero tracking_yaw reward, and the velocity
        curriculum shrank yaw commands to that trivial floor so the robot never practiced the real yaw the spec A2 (err below
        0.15 rad per s across the full yaw range) tests. Reverted so yaw floor is raised to 0.30 for meaningful practice,
        and the moving-gate yaw threshold lowered 0.1 to 0.05 to match yaw_cmd_gate.
    1:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      near_zero_prob: 0.08
      near_zero_scale: 0.04
      mixed_axis_prob: 0.6
      x_axis_prob: 0.75
      prob_fwd: 0.55
      prob_back: 0.45
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.6
      lat_range:
      - 0.15
      - 0.55
      yaw_range:
      - 0.3
      - 1.1
      note: mixed vx/vy/wz plus stop exposure on flat; quality bars tighten (walk-down _1 keys).
    2:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.08
      near_zero_prob: 0.08
      near_zero_scale: 0.04
      mixed_axis_prob: 0.65
      x_axis_prob: 0.72
      prob_fwd: 0.55
      prob_back: 0.45
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.8
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.25
      - 1.0
      note: terrain and domain randomization begin here; tracking bars relax on terrain per spec (controlled traversal, not
        flat-band tracking).
    3:
      command_mode: mixed
      active_dirs:
      - fwd
      - back
      - lat
      - yaw
      stand_prob: 0.1
      near_zero_prob: 0.1
      near_zero_scale: 0.04
      mixed_axis_prob: 0.75
      x_axis_prob: 0.7
      prob_fwd: 0.55
      prob_back: 0.45
      fwd_range:
      - 0.3
      - 1.0
      back_range:
      - 0.15
      - 0.8
      lat_range:
      - 0.15
      - 0.5
      yaw_range:
      - 0.25
      - 1.0
      note: final command envelope fixed for terrain traversal; terrain is the primary difficulty axis.
model:
  terrain_perceiver:
    history_len: 25
    tick_dim: 54
    z_dim: 32
    dropout: 0.0
  actor:
    input_dim: 85
    hidden:
    - 1024
    - 512
  terrain_perceiver_aux:
    ramp_steps: 50000
    epochs: 1
    batch: 4096
    lr_scale: 0.5
env:
  observation_contract:
    deployable:
      body_dim: 53
      history_len: 25
      tick_dim: 54
      history_flat_dim: 1350
      actor_raw_dim: 1403
    actor_mlp:
      input_dim: 85
      formula: body_dim + terrain_perceiver.z_dim
    training_only:
      privileged_dim: 197
      aux_label_dim: 22
    policy_tensor_dim: 1622
  amp:
    frame_dim: 51
    frames: 2
    tensor_dim: 102
  observation:
    history_len: 25
    tick_dim: 54
    body_dim: 53
    privileged_dim: 197
    aux_label_dim: 22
    amp_frame_dim: 51
    amp_frames: 2
    observation_space: 1622
    amp_observation_space: 51
  control:
    action_scale: 0.35
    action_delay_steps: 1
    episode_length_s: 20.0
    decimation: 4
    dt: 0.005
    contact_force_threshold: 10.0
  gait:
    period: 0.55
    period_min: 0.34
    period_slope: 0.16
    duty: 0.5
  actuator:
    stiffness:
      hip: 349
      thigh: 120
      calf: 240
    damping:
      hip: 8
      thigh: 4
      calf: 3
  scene:
    num_envs: 4096
    env_spacing: 2.5
  commands:
    resample_s_min: 3.0
    resample_s_max: 6.0
    smooth_alpha: 0.93
    fwd_max: 1.0
    back_max: 0.8
    lat_max: 0.5
    yaw_max: 1.0
  curriculum:
    vel_curriculum_enable: false
    vel_cur_up: 0.85
    vel_cur_down: 0.55
    vel_cur_step: 0.0
    vel_terrain_decouple: false
    phase_intervals: 4
    penalty_ramp_intervals: 16
    penalty_budget_ratio_max: 1.05
    phase_gate_prog_0: 0.65
    phase_gate_prog_1: 0.62
    phase_gate_prog_2: 0.62
    phase_gate_prog_3: 0.68
    phase_gate_slip_0: 0.35
    phase_gate_diag_0: 0.45
    phase_gate_duty_0: 0.55
    phase_gate_air_0: 0.0
    phase_gate_slip_1: 0.28
    phase_gate_diag_1: 0.5
    phase_gate_duty_1: 0.64
    phase_gate_air_1: 0.0
    phase_gate_terrain_2: 3.5
    phase_gate_fall_2: 0.05
    terrain_start_phase: 2
    dr_start_phase: 2
    max_training_phase: 2
    regress_fall: 0.1
    regress_prog: 0.4
    terrain_gate_slip_high: 0.26
  terrain:
    stairs:
      step_height_range:
      - 0.08
      - 0.38
      proportion: 0.25
    boxes:
      grid_height_range:
      - 0.05
      - 0.3
  domain_randomization:
    enable: true
    start_level: 0
    unlock_terrain: 6.0
    push_interval_s_0: 0.0
    push_vel_0: 0.0
    push_interval_s_1: 30.0
    push_vel_1: 1.0
    mass_range_1:
    - -2.0
    - 4.0
    stiffness_scale_1:
    - 0.9
    - 1.1
    damping_scale_1:
    - 0.85
    - 1.15
    push_interval_s_2: 20.0
    push_vel_2: 1.5
    mass_range_2:
    - -4.0
    - 12.0
    stiffness_scale_2:
    - 0.8
    - 1.2
    damping_scale_2:
    - 0.7
    - 1.3
    push_interval_s_3: 15.0
    push_vel_3: 2.0
    push_ang_scale: 0.8
    mass_range_3:
    - -5.0
    - 20.0
    stiffness_scale_3:
    - 0.6
    - 1.4
    damping_scale_3:
    - 0.6
    - 1.4
    friction_range_3:
    - 0.4
    - 1.4
    com_offset_3: 0.05
    imu_gyro_bias_3: 0.05
    imu_grav_bias_3: 0.03
    gate_progress: 0.68
    gate_progress_l2: 0.72
    gate_progress_l3: 0.76
    gate_intervals: 8
  blind_overrides:
    sym_augment: false
    speed_tol_abs: 0.1
    speed_tol_rel: 0.15
    base_clearance: 0.08
    stance_dx: 0.05
    clr_rough_flat: 0.01
    clr_rough_span: 0.12
    clr_rough_bonus_max: 0.26
reward:
  sigma_lin_abs: 0.1
  sigma_lin_rel: 0.15
  sigma_yaw: 0.08
  sigma_stand_speed: 0.05
  sigma_stand_yaw: 0.05
  sigma_stand_pose: 0.2
  sigma_stand_action: 0.3
  nominal_base_h: 0.52
  tilt_ok_rad: 0.2617993878
  tilt_gate_close_rad: 0.6981317008
  flat_clearance_target: 0.08
  terrain_clearance_margin: 0.04
  clearance_band: 0.02
  terrain_v_floor: 0.1
  w_tracking_lin: 2.5
  w_track_far: 1.0
  scale_track_far: 0.35
  w_tracking_yaw: 3.1
  w_yaw_far: 1.5
  w_stand: 1.5
  w_stand_far: 1.5
  scale_stand_far: 0.2
  w_stand_contact: 1.8
  w_terrain_progress: 1.15
  w_gait_anchor: 1.0
  w_feet_air_time: 0.5
  air_time_target: 0.3
  w_off_axis: 0.5
  w_wrong_dir: 0.8
  w_action_rate: 0.02
  w_stance_slip: 0.55
  w_stance_slip_late: 0.75
  slip_free_speed: 0.05
  slip_speed_scale: 1.0
  w_landing_impact: 0.15
  w_landing_impact_late: 0.85
  impact_speed_scale: 1.0
  w_orient: 0.3
  orient_soft_rad: 0.09
  orient_scale_rad: 0.35
  w_base_vz: 1.0
  w_base_wxy: 0.2
  w_hip_deviation: 1.5
  hip_deviation_scale: 0.35
  w_clearance_under: 1.25
  w_clearance_over: 1.2
  w_diagonal_contact: 0.75
  w_duty_balance: 0.70
  duty_target: 0.5
  quality_window_ema_beta: 0.98
  slip_high_threshold: 0.2
  rear_duty_tolerance: 0.05
  w_torque_margin: 1.5
  w_torque_saturation: 5.0
  w_terminal: 10.0
  healthy_progress_floor: 0.35
  healthy_progress_slip_target: 0.08
  healthy_progress_slip_width: 0.16
  terrain_clearance_drive: 0.75
  validated_tracking_floor: 0.40
  tracking_validity_terrain_mix: 1.0
  w_stance_slip_high_late: 1.5
skrl:
  seed: 42
  models:
    separate: true
    policy:
      class: TerrainPerceiverPolicy
      clip_actions: false
      clip_log_std: true
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: -1.0
      fixed_log_std: false
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 1024
        - 512
        activations: relu
      output: ONE
    discriminator:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 1024
        - 512
        activations: relu
      output: ONE
  memory:
    class: RandomMemory
    memory_size: -1
  motion_dataset:
    class: RandomMemory
    memory_size: 200000
  reply_buffer:
    class: RandomMemory
    memory_size: 1000000
  agent:
    class: AMP
    rollouts: 32
    learning_epochs: 4
    mini_batches: 16
    discount_factor: 0.99
    lambda: 0.95
    learning_rate: 0.0001
    learning_rate_scheduler: KLAdaptiveLR
    learning_rate_scheduler_kwargs:
      kl_threshold: 0.016
      min_lr: 3.0e-05
    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null
    amp_state_preprocessor: RunningStandardScaler
    amp_state_preprocessor_kwargs: null
    random_timesteps: 0
    learning_starts: 0
    grad_norm_clip: 1.0
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: true
    entropy_loss_scale: 0.02
    value_loss_scale: 2.5
    discriminator_loss_scale: 5.0
    amp_batch_size: 512
    task_reward_weight: 1.0
    style_reward_weight: 2.0
    discriminator_batch_size: 4096
    discriminator_reward_scale: 3.0
    discriminator_logit_regularization_scale: 0.05
    discriminator_gradient_penalty_scale: 5.0
    discriminator_weight_decay_scale: 0.0001
    time_limit_bootstrap: true
    experiment:
      directory: taili_amp_blind
      experiment_name: ''
      write_interval: auto
      checkpoint_interval: 2000
  trainer:
    class: SequentialTrainer
    timesteps: 1500000
    environment_info: log
