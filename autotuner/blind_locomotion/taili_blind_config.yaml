    rew_lateral_underspeed: -0.35
    rew_wrong_dir: -0.25
    w_imitate_live: 1.6
    imitate_sigma_live: 0.09
    imitate_fwd_floor: 0.5
    w_swing_dir: 0.0
    rew_climb: 6.2
    climb_slip_gate: 0.26
    climb_slip_soft_span: 0.22
    climb_vz_cap: 0.8
    rew_terrain_up: 7.4
    rew_terrain_down: 5.0
    rew_terrain_support_transfer: 3.4
