name: push_observation
num_envs: 32
reset_policy: per_case
reset_initialization: command_start
terrains:
  - type: flat
    level: 0
dr_cases:
  - level: 0
commands:
  - mode: stand
    vx: 0.0
    vy: 0.0
    wz: 0.0
    duration: 3.0
  - mode: forward
    vx: 0.5
    vy: 0.0
    wz: 0.0
    duration: 4.0
pushes:
  enabled: true
  events:
    - segment: 0
      time: 1.0
      vector: [0.0, 0.5, 0.0]
    - segment: 1
      time: 1.0
      vector: [0.0, 0.5, 0.0]
