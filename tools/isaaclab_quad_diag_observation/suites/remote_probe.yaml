name: remote_probe
num_envs: 1
reset_policy: per_case
reset_initialization: command_start
terrains:
  - type: flat
    level: 0
dr_cases:
  - level: 0
commands:
  - mode: stand
    vx: 0.0
    vy: 0.0
    wz: 0.0
    duration: 0.2
  - mode: forward
    vx: 0.5
    vy: 0.0
    wz: 0.0
    duration: 0.4
